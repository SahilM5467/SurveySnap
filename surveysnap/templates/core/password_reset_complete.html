{% extends "base.html" %}
{% block content %}

<div class="flex min-h-screen items-center justify-center px-6 py-12">
    <div class="w-full max-w-2xl rounded-[2rem] border border-slate-200 bg-white p-10 text-center shadow-[0_30px_80px_rgba(15,23,42,0.08)]">
        <div class="mx-auto inline-flex h-20 w-20 items-center justify-center rounded-[1.75rem] bg-emerald-50 text-emerald-500">
            <i data-lucide="badge-check" class="h-10 w-10"></i>
        </div>
        <h1 class="mt-8 text-4xl font-black tracking-tight text-slate-900">Password updated successfully</h1>
        <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-slate-500">
            Your SurveySnap password has been reset. You can now sign in with your new credentials and continue working securely.
        </p>

        <div class="mt-10 flex flex-col items-center justify-center gap-3 sm:flex-row">
            <a href="{% url 'login' %}" class="flex h-12 items-center justify-center rounded-2xl bg-primary px-8 text-sm font-bold text-white transition hover:bg-primary/90">
                Sign in now
            </a>
            <a href="{% url 'home' %}" class="flex h-12 items-center justify-center rounded-2xl border border-slate-200 px-8 text-sm font-semibold text-slate-700 transition hover:border-primary hover:text-primary">
                Go to home
            </a>
        </div>
    </div>
</div>

{% endblock content %}
